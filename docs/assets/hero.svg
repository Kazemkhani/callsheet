<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="Callsheet: sixty ushers placed on verified experience, in the channel the crew already uses">
  <title>Callsheet</title>
  <rect x="0" y="0" width="1600" height="500" fill="#F4F1EA"/>

  <line x1="96" y1="64" x2="1504" y2="64" stroke="#D9D3C7" stroke-width="1"/>
  <line x1="96" y1="436" x2="1504" y2="436" stroke="#D9D3C7" stroke-width="1"/>

  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
