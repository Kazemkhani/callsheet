  </g>

  <text x="96" y="258" font-family="Fraunces, Georgia, serif" font-size="104" font-weight="700" letter-spacing="-2" fill="#1A1917">Callsheet</text>

  <line x1="96" y1="292" x2="940" y2="292" stroke="#D9D3C7" stroke-width="1"/>

  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" fill="#1A1917">
    <text x="96" y="332" font-size="20">Sixty ushers placed on verified experience, in the channel the crew already uses.</text>
  </g>
